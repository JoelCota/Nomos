# Builds the Windows installer when a version tag (v1.2.3) is pushed and
# publishes it as a GitHub Release. The release notes are the tag's message
# (git tag -a vX.Y.Z -F notas.md), followed by the list of merged PRs.
# Can also be run by hand from the Actions tab (installer only, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Nomos-Setup
          path: release/Nomos-Setup-*.exe

      # actions/checkout can turn an annotated tag into a lightweight one, so
      # fetch it again to read its message.
      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nomos ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: release/Nomos-Setup-*.exe
