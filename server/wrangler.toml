# Nomos sync API (Cloudflare Worker + D1). See server/README.md to deploy it.
name = "nomos-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nomos"
# Replace with the id printed by `npx wrangler d1 create nomos`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
